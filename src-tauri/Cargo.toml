[package]
name = "bilidanmu"
version = "0.5.3"
description = "B站直播间弹幕发送客户端"
authors = ["sfqy"]
edition = "2021"

[lib]
name = "bilidanmu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 礼物打赏（真实扣费）编译期开关：官方发布默认关闭，自行编译开启方式见 README「礼物打赏」一节
[features]
gift-send = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
danmaku-core = { git = "https://github.com/sfqy211/danmaku-core.git", rev = "712785f8f8b8e6e5ac026f961630a1b1583ce2ae" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-store = "2.5"
tauri-plugin-shell = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
reqwest = { version = "0.13", features = ["rustls", "json", "stream", "query", "form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
md-5 = "0.10"
rand = "0.8"
chrono = "0.4"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
url = "2.5"
log = "0.4"
thiserror = "2"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hyper = { version = "1", features = ["http1", "server"] }
native-tls = "0.2"
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
open = "5"
sherpa-onnx = "2.0"
symphonia = { version = "0.6.0", default-features = false, features = ["aac"] }
# STT 模型包解压（tar.bz2；两者已在依赖树中由 sherpa-onnx-sys 引入，显式声明零增量）
tar = "0.4"
bzip2 = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"




