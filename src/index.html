<!doctype html>
<html lang="zh-CN" data-theme-storage-key="bilidanmu-theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BiliDanmu</title>
    <script>
      (() => {
        try {
          const storageKey = document.documentElement.dataset.themeStorageKey;
          const storedTheme = storageKey ? localStorage.getItem(storageKey) : null;
          const theme = storedTheme || "system";
          const dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (storageKey && !storedTheme) {
            localStorage.setItem(storageKey, theme);
          }
        } catch {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
  </html>
