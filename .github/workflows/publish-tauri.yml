name: publish-tauri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if version tag exists
        id: check
        run: |
          VERSION=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "app-v$VERSION" >/dev/null 2>&1; then
            echo "Tag app-v$VERSION already exists, skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION detected"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  changelog:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$LATEST_TAG..HEAD"
          fi

          FEAT=$(git log --pretty=format:"%s" "$RANGE" | grep -E "^feat" | sed 's/^feat: */- /; s/^feat(\([^)]*\)): */- [\1] /' || true)
          FIX=$(git log --pretty=format:"%s" "$RANGE" | grep -E "^fix" | sed 's/^fix: */- /; s/^fix(\([^)]*\)): */- [\1] /' || true)
          REFACTOR=$(git log --pretty=format:"%s" "$RANGE" | grep -E "^refactor" | sed 's/^refactor: */- /; s/^refactor(\([^)]*\)): */- [\1] /' || true)
          OTHER=$(git log --pretty=format:"%s" "$RANGE" | grep -vE "^(feat|fix|refactor)" | sed 's/^/- /' || true)

          BODY=""
          if [ -n "$FEAT" ]; then BODY="$BODY## ✨ 新功能"$'\n'"$FEAT"$'\n\n'; fi
          if [ -n "$FIX" ]; then BODY="$BODY## 🐛 修复"$'\n'"$FIX"$'\n\n'; fi
          if [ -n "$REFACTOR" ]; then BODY="$BODY## ♻️ 重构"$'\n'"$REFACTOR"$'\n\n'; fi
          if [ -n "$OTHER" ]; then BODY="$BODY## 📦 其他"$'\n'"$OTHER"$'\n\n'; fi

          if [ -z "$BODY" ]; then BODY="- 初始版本"; fi

          EOF=$(uuidgen)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

  publish:
    needs: [check, changelog]
    if: needs.check.outputs.should_build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal = 一个 dmg 同时覆盖 Apple Silicon 和 Intel
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04 而非 24.04：AppImage 工具链兼容 + 产物 glibc 向下兼容更老的发行版
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Azure 官方镜像源偶发长时间卡死，换 kernel.org 镜像并启用快速超时重试
          sudo sed -i 's|azure.archive.ubuntu.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=10 -o Acquire::http::Timeout=30 libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Rust check
        run: cargo check
        working-directory: src-tauri

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'BiliDanmu v__VERSION__'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 官网下载按钮走 releases/latest/download/<资产名> 直链，资产名必须恒定。
  # Tauri 打包器的产物名固定带版本号且不可配置，本任务统一改名：上传不带版本号
  # 的资产后删除带版本号的原件——版本信息由 tag 和 release 标题承载，页面更干净。
  stable-asset-names:
    needs: publish
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Rename release assets without version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          TAG="app-v$VERSION"
          mkdir assets && cd assets
          gh release download "$TAG" \
            --pattern 'BiliDanmu_*_x64-setup.exe' \
            --pattern 'BiliDanmu_*_universal.dmg' \
            --pattern 'BiliDanmu_*_amd64.AppImage' \
            --pattern 'BiliDanmu_*_x64_en-US.msi' \
            --pattern 'BiliDanmu_*_universal.app.tar.gz' \
            --pattern 'BiliDanmu_*_amd64.deb' \
            --pattern 'BiliDanmu-*.x86_64.rpm'
          mv BiliDanmu_*_x64-setup.exe       BiliDanmu-x64-setup.exe
          mv BiliDanmu_*_universal.dmg       BiliDanmu-universal.dmg
          mv BiliDanmu_*_amd64.AppImage      BiliDanmu-amd64.AppImage
          mv BiliDanmu_*_x64_en-US.msi       BiliDanmu-x64_en-US.msi
          mv BiliDanmu_*_universal.app.tar.gz BiliDanmu-universal.app.tar.gz
          mv BiliDanmu_*_amd64.deb           BiliDanmu_amd64.deb
          mv BiliDanmu-*.x86_64.rpm          BiliDanmu.x86_64.rpm
          gh release upload "$TAG" --clobber \
            BiliDanmu-x64-setup.exe BiliDanmu-universal.dmg BiliDanmu-amd64.AppImage \
            BiliDanmu-x64_en-US.msi BiliDanmu-universal.app.tar.gz \
            BiliDanmu_amd64.deb BiliDanmu.x86_64.rpm
          # 固定名副本已就位，删除带版本号的原件
          for name in \
            "BiliDanmu_${VERSION}_x64-setup.exe" \
            "BiliDanmu_${VERSION}_universal.dmg" \
            "BiliDanmu_${VERSION}_amd64.AppImage" \
            "BiliDanmu_${VERSION}_x64_en-US.msi" \
            "BiliDanmu_${VERSION}_universal.app.tar.gz" \
            "BiliDanmu_${VERSION}_amd64.deb" \
            "BiliDanmu-${VERSION}-1.x86_64.rpm"
          do
            ID=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id")
            if [ -n "$ID" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$ID"; fi
          done
